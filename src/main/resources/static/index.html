<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SeismicMonitor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1>Active Earthquake Alerts</h1>
<div id="alerts-container"></div>

<h2>Report Shaking</h2>
<form id="report-form">
    <label>Alert ID: <input type="number" id="alert-id"></label>
    <label>Intensity (1-10): <input type="number" id="intensity" min="1" max="10"></label>
    <button type="submit">Submit Report</button>
</form>

<script src="js/alerts.js"></script>
</body>
</html>
